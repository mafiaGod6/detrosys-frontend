<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 1. The Favicon (Ensure favicon.svg is inside your /public directory) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- 2. The Site Name (Change this to what you want people to see) -->
    <title>Detrosys</title>
    
    <!-- 3. Open Graph Metadata (Helps search engines identify the site name) -->
    <meta property="og:site_name" content="Detrosys" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Theme Script (Kept as is) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("detrosys-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (theme === "dark" || (!theme && systemDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
