<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Detrosys | Email & SMS Marketing Automation (Bring Your Own Provider)</title>
    <meta
      name="description"
      content="Detrosys connects contacts, segments, and email/SMS campaigns in one place. Use your own SendGrid, Resend or SMS provider keys and skip the SaaS tax."
    />
    <link rel="canonical" href="https://detrosys.online/" />

    <meta property="og:site_name" content="Detrosys" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Detrosys | Email & SMS Marketing Automation" />
    <meta
      property="og:description"
      content="Connect contacts, segments, and email/SMS campaigns in one place. Bring your own provider keys."
    />
    <meta property="og:url" content="https://detrosys.online/" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Detrosys",
        "alternateName": "Detrosys Online",
        "url": "https://detrosys.online/"
      }
    </script>

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("detrosys-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (theme === "dark" || (!theme && systemDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
